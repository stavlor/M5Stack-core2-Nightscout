[platformio]
default_envs = core2

[env:core2]
platform = espressif32@6.12.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default_16MB.csv
board_build.embed_txtfiles = certs/root-ca.pem
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Unified@0.2.28
  m5stack/M5GFX@0.2.35
  bblanchon/ArduinoJson@6.21.5

[env:parser-tests]
extends = env:core2
build_flags = ${env:core2.build_flags} -DRUN_PARSER_TESTS
